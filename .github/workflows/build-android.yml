
name: Build Android APK

# AndroidForge - Universal Android APK Builder

on:
  workflow_dispatch:
    inputs:
      zip_source:
        description: "Where should the workflow get the source ZIP from?"
        type: choice
        required: true
        default: "input-directory"
        options:
          - "input-directory"
          - "download-url"
          - "release-asset"

      zip_path:
        description: "Exact ZIP path relative to repository root"
        required: false
        type: string
        default: ""

      zip_url:
        description: "Direct download URL"
        required: false
        type: string
        default: ""

      release_tag:
        description: "GitHub Release tag"
        required: false
        type: string
        default: ""

      build_variant:
        description: "Build variant"
        type: choice
        required: true
        default: "auto"
        options:
          - "auto"
          - "debug"
          - "release"
          - "bundle"

      enable_ndk:
        description: "Force NDK installation"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  actions: write
  packages: read

concurrency:
  group: androidforge-build-${{ github.ref }}-${{ github.event.inputs.zip_source || 'auto' }}
  cancel-in-progress: false

env:
  ANDROID_HOME: /opt/android-sdk
  ANDROID_SDK_ROOT: /opt/android-sdk
  JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.caching=false"
  PYTHONUNBUFFERED: "1"

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    container: ghcr.io/riyajkhokhar2-ai/androidforge-build-env:latest
    timeout-minutes: 60

    outputs:
      project_type: ${{ steps.detect.outputs.project_type }}
      build_succeeded: ${{ steps.build.outputs.build_succeeded }}
      apk_count: ${{ steps.collect.outputs.apk_count }}
      primary_apk_name: ${{ steps.collect.outputs.primary_apk_name }}

    steps:

      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Install Python dependencies
      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip --quiet
          python3 -m pip install -r scripts/requirements.txt --quiet

      # 3. Acquire source ZIP
      - name: Acquire source ZIP
        id: acquire
        shell: bash
        run: |
          python3 scripts/acquire_zip.py \
            --source "${{ inputs.zip_source || 'input-directory' }}" \
            --url "${{ inputs.zip_url }}" \
            --tag "${{ inputs.release_tag }}" \
            --path "${{ inputs.zip_path }}"

      # 4. Extract ZIP
      - name: Extract source ZIP
        id: extract
        shell: bash
        run: |
          python3 scripts/extract_zip.py \
            --zip "${{ steps.acquire.outputs.zip_path }}"

      # 5. Detect project type
      - name: Detect project type
        id: detect
        shell: bash
        run: |
          python3 scripts/detect_project.py \
            --root "${{ steps.extract.outputs.project_root }}" \
            --output detection.json

          echo "::group::Detection JSON"
          cat detection.json
          echo "::endgroup::"

      # 6. Configure toolchain
      - name: Configure toolchain
        id: toolchain
        shell: bash
        run: |
          python3 scripts/setup_environment.py \
            --root "${{ steps.extract.outputs.project_root }}" \
            --detect detection.json \
            --android-sdk "$ANDROID_HOME" \
            --output toolchain.json

          echo "::group::Toolchain JSON"
          cat toolchain.json
          echo "::endgroup::"

      # 7. Self-heal project
      - name: Self-heal project
        id: self_heal
        shell: bash
        run: |
          python3 scripts/self_heal.py \
            --root "${{ steps.extract.outputs.project_root }}" \
            --detect detection.json \
            --toolchain toolchain.json \
            --android-sdk "$ANDROID_HOME" \
            --output self_heal.json

          echo "::group::Self-heal report"
          cat self_heal.json
          echo "::endgroup::"

      # 8. Fix Gradle Wrapper version
      - name: Fix Gradle Wrapper version
        shell: bash
        env:
          PROJECT_ROOT: ${{ steps.extract.outputs.project_root }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import sys

          root = Path(os.environ["PROJECT_ROOT"])

          wrappers = list(root.rglob("gradle-wrapper.properties"))

          if not wrappers:
              print("WARNING: No Gradle Wrapper found.")
              print("Standalone Gradle configuration will be used.")
              sys.exit(0)

          target = (
              r"distributionUrl=https\://services.gradle.org/"
              r"distributions/gradle-9.3.1-bin.zip"
          )

          for prop in wrappers:
              lines = prop.read_text(
                  encoding="utf-8"
              ).splitlines()

              updated = []
              found = False

              for line in lines:
                  if line.strip().startswith("distributionUrl="):
                      updated.append(target)
                      found = True

                  elif line.strip().startswith("distributionSha256Sum="):
                      continue

                  else:
                      updated.append(line)

              if not found:
                  updated.append(target)

              prop.write_text(
                  "\n".join(updated) + "\n",
                  encoding="utf-8"
              )

              print(f"Updated Gradle Wrapper: {prop}")

          print("SUCCESS: Gradle Wrapper updated to 9.3.1")
          PY

      # 9. Switch JAVA_HOME
      - name: Switch JAVA_HOME to detected version
        shell: bash
        run: |
          JDK_VER="${{ steps.toolchain.outputs.jdk_version }}"

          case "$JDK_VER" in
            8)
              NEW_JH=/usr/lib/jvm/java-8-openjdk-amd64
              ;;
            11)
              NEW_JH=/usr/lib/jvm/java-11-openjdk-amd64
              ;;
            17)
              NEW_JH=/usr/lib/jvm/java-17-openjdk-amd64
              ;;
            21)
              NEW_JH=/usr/lib/jvm/java-17-openjdk-amd64
              ;;
            *)
              echo "Unknown JDK version: $JDK_VER"
              NEW_JH=/usr/lib/jvm/java-17-openjdk-amd64
              ;;
          esac

          echo "Switching JAVA_HOME to $NEW_JH"

          echo "JAVA_HOME=$NEW_JH" >> "$GITHUB_ENV"
          echo "$NEW_JH/bin" >> "$GITHUB_PATH"

          java -version

      # 10. Install Android SDK components
      - name: Install missing Android SDK components
        shell: bash
        run: |
          NEEDS_NDK="${{ steps.toolchain.outputs.needs_ndk }}"
          NDK_VER="${{ steps.toolchain.outputs.ndk_version }}"

          COMPILE_SDK=$(python3 -c \
            "import json; d=json.load(open('detection.json')); print(d.get('versions',{}).get('compile_sdk') or '')")

          echo "Project compileSdk=$COMPILE_SDK"

          if [ -n "$COMPILE_SDK" ]; then
            if [ ! -d "$ANDROID_HOME/platforms/android-$COMPILE_SDK" ]; then
              echo "Installing Android platform $COMPILE_SDK"
              yes | sdkmanager "platforms;android-$COMPILE_SDK" || true
            else
              echo "Android platform already installed."
            fi
          fi

          yes | sdkmanager "platform-tools" >/dev/null 2>&1 || true

          if [ "$NEEDS_NDK" = "true" ] || \
             [ "${{ inputs.enable_ndk }}" = "true" ]; then

            if [ -n "$NDK_VER" ] && \
               [ ! -d "$ANDROID_HOME/ndk/$NDK_VER" ]; then

              echo "Installing NDK $NDK_VER"

              yes | sdkmanager "ndk;$NDK_VER" || \
                echo "WARNING: NDK installation failed"
            fi

            yes | sdkmanager "cmake;3.22.1" >/dev/null 2>&1 || true
          fi

      # 11. Switch Flutter version
      - name: Switch Flutter version
        if: steps.toolchain.outputs.needs_flutter == 'true'
        shell: bash
        run: |
          DETECTED="${{ steps.toolchain.outputs.flutter_version }}"

          CURRENT=$(flutter --version | head -1 | awk '{print $4}')

          echo "Project Flutter: $DETECTED"
          echo "Installed Flutter: $CURRENT"

          if [ "$DETECTED" != "$CURRENT" ] && [ -n "$DETECTED" ]; then
            flutter downgrade "$DETECTED" 2>/dev/null || true
            flutter --version
          fi

          flutter config \
            --enable-linux-desktop \
            --enable-windows-desktop \
            --enable-macos-desktop || true

      # 12. Restore Gradle cache
      # Fixed: No hashFiles dependency
      - name: Restore Gradle cache
        if: steps.toolchain.outputs.needs_gradle == 'true'
        uses: actions/cache@v4
        with:
          path: |
            /root/.gradle/caches
            /root/.gradle/wrapper
            ${{ steps.extract.outputs.project_root }}/.gradle
          key: gradle-${{ runner.os }}-v1
          restore-keys: |
            gradle-${{ runner.os }}-
            gradle-

      # 13. Restore Flutter cache
      # Fixed: No hashFiles dependency
      - name: Restore Flutter pub cache
        if: steps.toolchain.outputs.needs_flutter == 'true'
        uses: actions/cache@v4
        with:
          path: /root/.pub-cache
          key: flutter-pub-${{ runner.os }}-v1
          restore-keys: |
            flutter-pub-${{ runner.os }}-
            flutter-pub-

      # 14. Verify standalone Gradle
      - name: Verify standalone Gradle
        if: steps.toolchain.outputs.use_wrapper == 'false'
        shell: bash
        run: |
          GRADLE_VER="${{ steps.toolchain.outputs.gradle_version }}"

          echo "Checking standalone Gradle"

          if [ -n "$GRADLE_VER" ] && [ "$GRADLE_VER" != "8.9" ]; then
            echo "Downloading Gradle $GRADLE_VER"

            wget -q \
              "https://services.gradle.org/distributions/gradle-${GRADLE_VER}-bin.zip" \
              -O /tmp/gradle.zip

            unzip -q /tmp/gradle.zip -d /opt

            echo "/opt/gradle-${GRADLE_VER}/bin" >> "$GITHUB_PATH"
          fi

          gradle --version

      # 15. Build project
      - name: Build project
        id: build
        continue-on-error: true
        shell: bash
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/build_project.py" \
            --root "${{ steps.extract.outputs.project_root }}" \
            --detect "$GITHUB_WORKSPACE/detection.json" \
            --toolchain "$GITHUB_WORKSPACE/toolchain.json" \
            --variant "${{ inputs.build_variant || 'auto' }}" \
            --log-dir "$GITHUB_WORKSPACE/.androidforge/logs" \
            --output "$GITHUB_WORKSPACE/build.json" || true

          if [ ! -f "$GITHUB_WORKSPACE/build.json" ]; then
            echo '{"build_succeeded": false, "successful_command": null, "exit_code": -1, "log_file": null}' \
              > "$GITHUB_WORKSPACE/build.json"
          fi

          cat "$GITHUB_WORKSPACE/build.json"

          BUILD_OK=$(python3 -c \
            "import json; d=json.load(open('$GITHUB_WORKSPACE/build.json')); print(str(d.get('build_succeeded',False)).lower())")

          echo "build_succeeded=$BUILD_OK" >> "$GITHUB_OUTPUT"

      # 16. Collect APKs
      - name: Collect APKs
        id: collect
        if: always()
        shell: bash
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/collect_apk.py" \
            --root "${{ steps.extract.outputs.project_root }}" \
            --variant "${{ inputs.build_variant || 'auto' }}" \
            --output-dir "$GITHUB_WORKSPACE/output" \
            --output-json "$GITHUB_WORKSPACE/collect.json" || true

          if [ ! -f "$GITHUB_WORKSPACE/collect.json" ]; then
            echo '{"apk_count": 0, "primary": null, "all_apks": []}' \
              > "$GITHUB_WORKSPACE/collect.json"
          fi

          cat "$GITHUB_WORKSPACE/collect.json"

          APK_COUNT=$(python3 -c \
            "import json; d=json.load(open('$GITHUB_WORKSPACE/collect.json')); print(d.get('apk_count',0))")

          PRIMARY_APK=$(python3 -c \
            "import json; d=json.load(open('$GITHUB_WORKSPACE/collect.json')); print(d.get('primary') or '')")

          APK_DIR="$GITHUB_WORKSPACE/output"

          echo "apk_count=$APK_COUNT" >> "$GITHUB_OUTPUT"
          echo "primary_apk_name=$(basename "$PRIMARY_APK")" >> "$GITHUB_OUTPUT"
          echo "apk_directory=$APK_DIR" >> "$GITHUB_OUTPUT"

      # 17. Upload APK artifact
      - name: Upload APK artifact
        if: steps.collect.outputs.apk_count != '0' && steps.collect.outputs.apk_count != ''
        uses: actions/upload-artifact@v4
        with:
          name: AndroidForge-APKs
          path: ${{ steps.collect.outputs.apk_directory }}/*.apk
          if-no-files-found: ignore
          retention-days: 30
          compression-level: 0

      # 18. Upload AAB artifact
      - name: Upload AAB artifact
        if: steps.collect.outputs.apk_count != '0' && steps.collect.outputs.apk_count != ''
        uses: actions/upload-artifact@v4
        with:
          name: AndroidForge-AAB
          path: ${{ steps.collect.outputs.apk_directory }}/*.aab
          if-no-files-found: ignore
          retention-days: 30

      # 19. Publish APKs to GitHub Release
      - name: Publish APKs to output release
        if: always() && steps.collect.outputs.apk_count != '0' && steps.collect.outputs.apk_count != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="web-build-output-${{ github.run_id }}"
          REPO_API="https://api.github.com/repos/$GITHUB_REPOSITORY"

          AUTH_HEADER="Authorization: Bearer $GH_TOKEN"
          API_VERSION="X-GitHub-Api-Version: 2022-11-28"
          ACCEPT="Accept: application/vnd.github+json"

          echo "Creating release $TAG"

          RELEASE_RESPONSE=$(curl -sS -X POST \
            -H "$AUTH_HEADER" \
            -H "$ACCEPT" \
            -H "$API_VERSION" \
            -H "Content-Type: application/json" \
            "$REPO_API/releases" \
            -d "{\"tag_name\":\"$TAG\",\"target_commitish\":\"main\",\"name\":\"Build #${{ github.run_number }} output\",\"body\":\"Generated by AndroidForge.\",\"prerelease\":true}")

          RELEASE_ID=$(echo "$RELEASE_RESPONSE" | \
            python3 -c "import json,sys; print(json.load(sys.stdin).get('id',''))" 2>/dev/null)

          if [ -z "$RELEASE_ID" ]; then
            RELEASE_ID=$(curl -sS \
              -H "$AUTH_HEADER" \
              -H "$ACCEPT" \
              -H "$API_VERSION" \
              "$REPO_API/releases/tags/$TAG" | \
              python3 -c "import json,sys; print(json.load(sys.stdin).get('id',''))" 2>/dev/null)
          fi

          if [ -z "$RELEASE_ID" ]; then
            echo "::error::Could not create or find release."
            echo "$RELEASE_RESPONSE"
            exit 1
          fi

          cd "$GITHUB_WORKSPACE/output"

          shopt -s nullglob
          UPLOADED=0

          for f in *.apk *.aab; do
            [ -e "$f" ] || continue

            echo "Uploading $f"

            UPLOAD_URL="https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$(basename "$f")"

            HTTP_CODE=$(curl -sS -X POST \
              -H "$AUTH_HEADER" \
              -H "$ACCEPT" \
              -H "$API_VERSION" \
              -H "Content-Type: application/zip" \
              --data-binary "@$f" \
              -o /tmp/upload-response.json \
              -w "%{http_code}" \
              "$UPLOAD_URL")

            if [ "$HTTP_CODE" = "201" ] || [ "$HTTP_CODE" = "200" ]; then
              echo "Uploaded $f"
              UPLOADED=$((UPLOADED+1))
            else
              echo "Upload failed: HTTP $HTTP_CODE"
              cat /tmp/upload-response.json | head -3
            fi
          done

          echo "output_release_tag=$TAG" >> "$GITHUB_OUTPUT"

          {
            echo "## AndroidForge Output Release"
            echo ""
            echo "Tag: $TAG"
            echo "Assets uploaded: $UPLOADED"
            echo ""

            curl -sS \
              -H "$AUTH_HEADER" \
              -H "$ACCEPT" \
              -H "$API_VERSION" \
              "$REPO_API/releases/$RELEASE_ID" | \
              python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          for a in d.get('assets',[]):
              print('- ' + a['name'] + ' (' + str(a['size']) + ' bytes)')
              print('  ' + a['browser_download_url'])
          " || true
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Release publishing completed."

      # 20. Upload build logs
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AndroidForge-logs
          path: |
            .androidforge/logs/
            ${{ steps.extract.outputs.project_root }}/build/outputs/
            ${{ steps.extract.outputs.project_root }}/**/build/reports/
            ${{ steps.extract.outputs.project_root }}/**/build/outputs/
          if-no-files-found: ignore
          retention-days: 14

      # 21. Diagnose failure
      - name: Diagnose failure
        if: steps.build.outputs.build_succeeded != 'true'
        shell: bash
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/diagnose_failure.py" \
            --root "${{ steps.extract.outputs.project_root }}" \
            --log-dir "$GITHUB_WORKSPACE/.androidforge/logs" || true

      # 22. Build summary
      - name: Build summary
        if: always()
        shell: bash
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/build_summary.py" \
            --detect "$GITHUB_WORKSPACE/detection.json" \
            --toolchain "$GITHUB_WORKSPACE/toolchain.json" \
            --build "$GITHUB_WORKSPACE/build.json" \
            --collect "$GITHUB_WORKSPACE/collect.json" || true

          if [ -f "$GITHUB_WORKSPACE/self_heal.json" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "## Self-heal report" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$GITHUB_WORKSPACE/self_heal.json" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      # 23. Final failure check
      - name: Fail if build failed
        if: steps.build.outputs.build_succeeded != 'true'
        shell: bash
        run: |
          echo "::error::Android build failed. Check AndroidForge-logs artifact."
          exit 1
